[project]
name = "VeloScope_BE_team30"
version = "0.1.0"
authors = [{ name = "Lastname Firstname" }, { name = "Lastname Firstname" }]
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "psycopg2-binary",
    "python-dotenv",
    "pydantic[email]",
    "pydantic_settings",
    "PyYAML",
    "requests",
    "regex",
    "uvicorn",
    "httpx",
    "apscheduler",
]

# Dependencies used only for development, not for runtime
[project.optional-dependencies]
dev = [
    "bandit",
    "black",
    "coverage",
    "mypy",
    "pylint",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" } # source files are in folder src

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
plugins = ['pydantic.mypy']
exclude = ["test_"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["*test*.py"]
addopts = "-v -s -x"

[tool.coverage.run]
branch = true
include = ["src/service/*", "src/dao/*"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "coverage_report"
